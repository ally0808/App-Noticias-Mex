<ion-content class="ion-padding ion-text-center">
  <div style="margin-top: 50px; margin-bottom: 30px;">
    <div style="background: #fdfdfd; display: inline-block; padding: 20px; border-radius: 20px;">
      <ion-icon name="newspaper-outline" style="font-size: 80px; color: #eb445a;"></ion-icon>
    </div>
    <h1 style="font-weight: 800; font-size: 2.2rem; margin-top: 15px; color: #333;">
      Noticias <span style="color: #eb445a;">..Mex.</span>
    </h1>
  </div>

  <div style="background: #f4f4f4; padding: 25px; border-radius: 20px; margin: 0 10px;">
    <ion-segment [(ngModel)]="modoRegistro" mode="ios" (ionChange)="vibrarMedio()" style="margin-bottom: 20px;">
      <ion-segment-button [value]="false"> <ion-label>Entrar</ion-label> </ion-segment-button>
      <ion-segment-button [value]="true"> <ion-label>Registrar</ion-label> </ion-segment-button>
    </ion-segment>

    <ion-list lines="none" style="background: transparent;">
      @if (modoRegistro) {
        <ion-item style="--background: #fff; --border-radius: 10px; margin-bottom: 10px; border: 1px solid #ddd;">
          <ion-input type="text" placeholder="Nombre completo" [(ngModel)]="nombreNuevo"></ion-input>
        </ion-item>
      }

      <ion-item style="--background: #fff; --border-radius: 10px; margin-bottom: 10px; border: 1px solid #ddd;">
        <ion-input type="email" placeholder="Correo" [(ngModel)]="correo"></ion-input>
      </ion-item>

      <ion-item style="--background: #fff; --border-radius: 10px; margin-bottom: 10px; border: 1px solid #ddd;">
        <ion-input type="password" placeholder="Contraseña" [(ngModel)]="clave"></ion-input>
      </ion-item>
    </ion-list>

    <div style="display: flex; flex-direction: column; align-items: center; margin-top: 10px;">
      <ion-button (click)="modoRegistro ? crearCuentaNueva() : iniciarSesion()" 
                  style="--background: #eb445a; --border-radius: 25px; width: 200px; height: 50px; font-weight: bold; color: white;">
        {{ modoRegistro ? 'CREAR CUENTA' : 'INGRESAR' }}
      </ion-button>

      @if (!modoRegistro) {
        <ion-button fill="clear" (click)="loginConHuella()" style="--color: #333; font-size: 0.8rem; margin-top: 10px;">
          <ion-icon name="finger-print-outline" slot="start" style="color: #eb445a;"></ion-icon>
          USAR HUELLA DIGITAL
        </ion-button>
      }
    </div>
  </div>
</ion-content>
