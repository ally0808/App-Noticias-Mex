<ion-header class="ion-no-border">
  <ion-toolbar color="danger">
    <ion-buttons slot="start">
      <ion-button (click)="regresar()">
        <ion-icon slot="icon-only" name="arrow-back-outline" style="color: white;"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Mi Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding ion-text-center">
  @if (dataService.usuarioLogueado()) {
    <div style="margin-top: 30px;">
      <ion-avatar (click)="verFoto()" style="margin: 0 auto; width: 140px; height: 140px; border: 4px solid #eb445a;">
        <img [src]="dataService.usuarioLogueado()?.foto" style="object-fit: cover;" />
      </ion-avatar>

      <ion-button fill="clear" (click)="cambiarFoto()" style="margin-top: 10px; font-weight: bold; --color: #eb445a;">
        <ion-icon name="camera-outline" slot="start"></ion-icon> CAMBIAR FOTO
      </ion-button>
    </div>

    <ion-button (click)="obtenerUbicacion()" expand="block" fill="outline" color="dark" style="margin-top: 20px; --border-radius: 15px;">
      <ion-icon name="location-outline" slot="start"></ion-icon>
      OBTENER MI UBICACIÓN
    </ion-button>

    <ion-list lines="full" class="ion-margin-top" style="border-radius: 15px;">
      <ion-item>
        <ion-input label="Nombre" labelPlacement="stacked" [ngModel]="dataService.usuarioLogueado()?.nombre" readonly></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Correo" labelPlacement="stacked" [ngModel]="dataService.usuarioLogueado()?.correo" readonly></ion-input>
      </ion-item>
    </ion-list>

    <div style="margin-top: 40px; padding: 0 20px;">
      <ion-button (click)="cerrarSesion()" expand="block" color="danger" style="--border-radius: 15px; font-weight: bold;">
        <ion-icon name="log-out-outline" slot="start"></ion-icon> CERRAR SESIÓN
      </ion-button>
    </div>
  }
</ion-content>
